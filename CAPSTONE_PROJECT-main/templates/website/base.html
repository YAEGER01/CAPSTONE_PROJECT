{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}CAUFA{% endblock %}</title>
  <link rel="icon" type="image/png" href="{% static 'img/isu_caufa_official.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <nav class="site-nav">
      <a class="brand" href="{% url 'home' %}">
        <img src="{% static 'img/isu_caufa_official.png' %}" alt="CAUFA logo">
        <span>
          <strong>CAUFA</strong>
          <small>ISU Cauayan Faculty Association</small>
        </span>
      </a>

      <button class="nav-toggle" type="button" aria-label="Toggle navigation" data-nav-toggle>Menu</button>

      <div class="nav-links" data-nav-links>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'members' %}">Members</a>
        <a href="{% url 'contact' %}">Contact</a>
      </div>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>© 2026 CAUFA | Isabela State University Cauayan Faculty Association</p>
  </footer>

  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
