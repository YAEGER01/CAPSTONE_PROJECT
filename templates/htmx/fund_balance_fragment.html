<div class="fund-balance-widget">
  <div class="balance-header">
    <h3><i class="fas fa-wallet"></i> Fund Balance</h3>
  </div>
  <div class="balance-grid">
    <div class="balance-item">
      <span class="label">Current Balance</span>
      <span class="value primary">₱{{ balance|floatformat:2 }}</span>
    </div>
    <div class="balance-item">
      <span class="label">Safety Threshold</span>
      <span class="value secondary">₱{{ safety_threshold|floatformat:2 }}</span>
    </div>
    <div class="balance-item">
      <span class="label">Available</span>
      <span class="value {% if available >= 0 %}success{% else %}danger{% endif %}">₱{{ available|floatformat:2 }}</span>
    </div>
    <div class="balance-item">
      <span class="label">This Month In</span>
      <span class="value success">+₱{{ month_in|floatformat:2 }}</span>
    </div>
    <div class="balance-item">
      <span class="label">This Month Out</span>
      <span class="value danger">-₱{{ month_out|floatformat:2 }}</span>
    </div>
  </div>
  <div class="balance-footer">
    <a href="#" onclick="setActiveModule('fund-ledger'); return false;" class="btn-link">
      <i class="fas fa-list"></i> View Full Ledger
    </a>
  </div>
</div>

<style>
.fund-balance-widget {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  margin-bottom: 20px;
}
.fund-balance-widget .balance-header h3 {
  margin: 0 0 16px 0;
  font-size: 18px;
  color: #1a1a2e;
}
.fund-balance-widget .balance-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.fund-balance-widget .balance-item {
  display: flex;
  flex-direction: column;
  padding: 8px 12px;
  background: #f8f9fa;
  border-radius: 8px;
}
.fund-balance-widget .balance-item .label {
  font-size: 12px;
  color: #6c757d;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.fund-balance-widget .balance-item .value {
  font-size: 20px;
  font-weight: 700;
  margin-top: 4px;
}
.fund-balance-widget .balance-item .value.primary { color: #1a1a2e; }
.fund-balance-widget .balance-item .value.secondary { color: #e9a820; }
.fund-balance-widget .balance-item .value.success { color: #28a745; }
.fund-balance-widget .balance-item .value.danger { color: #dc3545; }
.fund-balance-widget .balance-footer {
  margin-top: 16px;
  text-align: right;
}
.fund-balance-widget .balance-footer .btn-link {
  color: #0d6efd;
  text-decoration: none;
  font-size: 14px;
}
</style>
