<div class="section-container">
  <div class="section-header">
    <h2><i class="fas fa-check-double"></i> Pending Payroll Batches</h2>
  </div>

  <div id="pending-batches-list">
    <table class="table">
      <thead>
        <tr>
          <th>Payroll Period</th>
          <th>Total Amount</th>
          <th>Members</th>
          <th>Recorded By</th>
          <th>Notes</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="pending-batches-tbody">
        <tr>
          <td colspan="6" class="text-center">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Batch Detail Modal -->
<div id="batch-detail-modal" class="modal" style="display: none">
  <div class="modal-content modal-lg">
    <span class="close" onclick="closeBatchDetailModal()">&times;</span>
    <h3>Review Payroll Batch</h3>
    <div id="batch-detail-content"></div>
    <div
      class="form-actions"
      id="batch-actions"
      style="display: none; margin-top: 20px"
    >
      <div class="form-group">
        <label>Remarks / Reason (required for rejection)</label>
        <textarea id="auditor-remarks" class="form-control" rows="2"></textarea>
      </div>
      <button class="btn btn-danger" onclick="rejectBatch()">
        <i class="fas fa-times"></i> Return for Revision
      </button>
      <button class="btn btn-success" onclick="verifyBatch()">
        <i class="fas fa-check"></i> Mark as Verified
      </button>
    </div>
  </div>
</div>

<script>
  let currentBatchId = null;

  function loadPendingBatches() {
    fetch("/api/auditor/pending-payroll-batches/")
      .then((r) => r.json())
      .then((data) => {
        const tbody = document.getElementById("pending-batches-tbody");
        if (!data.batches || data.batches.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="6" class="text-center">No pending payroll batches.</td></tr>';
          return;
        }
        tbody.innerHTML = data.batches
          .map(
            (b) => `
        <tr>
          <td>${b.payroll_period}</td>
          <td>₱${parseFloat(b.total_amount).toFixed(2)}</td>
          <td>${b.member_count}</td>
          <td>${b.recorded_by}</td>
          <td>${b.notes || "—"}</td>
          <td>
            <button class="btn btn-sm btn-primary" onclick="reviewBatch(${b.batch_id})">
              <i class="fas fa-search"></i> Review
            </button>
          </td>
        </tr>
2      `,
          )
          .join("");
      });
  }

  function reviewBatch(batchId) {
    currentBatchId = batchId;
    fetch(`/api/auditor/payroll-batches/${batchId}/`)
      .then((r) => r.json())
      .then((data) => {
        if (!data.ok) {
          alert("Error loading batch");
          return;
        }
        const b = data.batch;
        let html = `
        <div class="detail-grid">
          <div><strong>Period:</strong> ${b.payroll_period}</div>
          <div><strong>Total:</strong> ₱${parseFloat(b.total_amount).toFixed(2)}</div>
          <div><strong>Members:</strong> ${b.member_count}</div>
          <div><strong>Status:</strong> ${b.status}</div>
          <div><strong>Recorded:</strong> ${b.recorded_by} on ${new Date(b.created_at).toLocaleDateString()}</div>
          <div><strong>Hardcopy Ref:</strong> ${b.hardcopy_reference || "—"}</div>
        </div>
        ${b.notes ? `<div class="notes"><strong>Notes:</strong> ${b.notes}</div>` : ""}
        <h4>Deductions (${(data.deductions || []).length})</h4>
        <table class="table table-sm">
          <thead><tr><th>Member</th><th>Category</th><th>Amount</th><th>Fund Impact</th></tr></thead>
          <tbody>
            ${(data.deductions || [])
              .map(
                (d) => `
              <tr>
                <td>${d.member_name}</td>
                <td>${d.category}</td>
                <td>₱${parseFloat(d.amount).toFixed(2)}</td>
                <td>${d.fund_impact === "inflow" ? "Inflow" : "Pass-through"}</td>
              </tr>
            `,
              )
              .join("")}
          </tbody>
        </table>
        ${
          (data.supporting_files || []).length
            ? `
          <h4>Supporting Files</h4>
          <ul>${data.supporting_files.map((f) => `<li><a href="${f.url}" target="_blank">${f.file_name}</a></li>`).join("")}</ul>
        `
            : ""
        }
      `;
        document.getElementById("batch-detail-content").innerHTML = html;
        document.getElementById("auditor-remarks").value = "";
        document.getElementById("batch-actions").style.display = "flex";
        document.getElementById("batch-detail-modal").style.display = "block";
      });
  }

  function verifyBatch() {
    if (!currentBatchId) return;
    const remarks = document.getElementById("auditor-remarks").value;
    fetch(`/api/auditor/payroll-batches/${currentBatchId}/verify/`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRFToken": getCSRF() },
      body: JSON.stringify({ remarks: remarks }),
    })
      .then((r) => r.json())
      .then((data) => {
        if (data.ok) {
          closeBatchDetailModal();
          loadPendingBatches();
          showToast("Payroll batch verified!");
        } else {
          alert(data.error || "Error verifying");
        }
      });
  }

  function rejectBatch() {
    if (!currentBatchId) return;
    const reason = document.getElementById("auditor-remarks").value;
    if (!reason) {
      alert("Reason is required for rejection.");
      return;
    }
    fetch(`/api/auditor/payroll-batches/${currentBatchId}/reject/`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRFToken": getCSRF() },
      body: JSON.stringify({ reason: reason }),
    })
      .then((r) => r.json())
      .then((data) => {
        if (data.ok) {
          closeBatchDetailModal();
          loadPendingBatches();
          showToast("Batch returned for revision.");
        } else {
          alert(data.error || "Error rejecting");
        }
      });
  }

  function closeBatchDetailModal() {
    document.getElementById("batch-detail-modal").style.display = "none";
    currentBatchId = null;
  }

  function getCSRF() {
    return document.querySelector("[name=csrfmiddlewaretoken]")?.value || "";
  }

  if (document.getElementById("pending-batches-tbody")) loadPendingBatches();
  document.addEventListener("htmx:afterOnLoad", function () {
    if (document.getElementById("pending-batches-tbody")) loadPendingBatches();
  });
</script>

<style>
  .section-container {
    padding: 20px;
  }
  .section-header {
    margin-bottom: 20px;
  }
  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .form-actions {
    gap: 8px;
    justify-content: flex-end;
  }
  .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
  }
  .modal-content {
    background: #fff;
    margin: 5% auto;
    padding: 24px;
    border-radius: 12px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-lg {
    width: 80%;
    max-width: 900px;
  }
  .close {
    float: right;
    font-size: 24px;
    cursor: pointer;
  }
</style>
