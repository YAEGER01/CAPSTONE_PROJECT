<div
  class="dashboard-panel module-fade-in universal-profile-wrapper"
  data-role="{% if 'treasurer' in request.path %}treasurer{% elif 'auditor' in request.path %}auditor{% else %}president{% endif %}"
>
  <div class="profile-header-accent"></div>

  <div class="profile-grid-layout">
    <!-- Left Side: Avatar Management Engine Block -->
    <div class="profile-avatar-card">
      <div class="avatar-view-container">
        <div class="avatar-preview-frame">
          <img
            id="profile-avatar-display"
            src="https://api.dicebear.com/7.x/bottts/svg?seed=CAUFA"
            alt="Profile Avatar Target"
          />
          <div
            class="avatar-upload-overlay"
            onclick="document.getElementById('avatar-file-input').click()"
          >
            <i class="fa-solid fa-camera"></i>
            <span>Change Photo</span>
          </div>
        </div>
        <input
          type="file"
          id="avatar-file-input"
          accept="image/*"
          style="display: none"
        />
      </div>

      <div class="profile-meta-capsule">
        <h3 id="meta-display-name-anchor">Loading Profile...</h3>
        <span class="role-badge-matrix" id="meta-role-badge">System User</span>
        <p class="system-id-string">
          <i class="fa-solid fa-fingerprint"></i> ID:
          <span id="meta-instructor-id-anchor">---</span>
        </p>
      </div>
    </div>

    <!-- Right Side: Structural Parameter Fields Form Grid -->
    <div class="profile-fields-card">
      <form
        id="universal-profile-form"
        class="dashboard-form"
        onsubmit="event.preventDefault()"
      >
        <div class="form-row-split">
          <div class="form-field-group">
            <label for="profile-display-name"
              ><i class="fa-solid fa-signature"></i> Display Name</label
            >
            <input
              type="text"
              id="profile-display-name"
              placeholder="e.g. Dr. Jane Doe, PhD"
              required
            />
          </div>
          <div class="form-field-group">
            <label for="profile-title"
              ><i class="fa-solid fa-graduation-cap"></i> Academic Title /
              Suffix</label
            >
            <input
              type="text"
              id="profile-title"
              placeholder="e.g. PhD MIT, Mitchell Scholar, MSc"
            />
          </div>
        </div>

        <div class="form-row-split">
          <div class="form-field-group">
            <label for="profile-instructor-id"
              ><i class="fa-solid fa-id-card"></i> Instructor ID</label
            >
            <input
              type="text"
              id="profile-instructor-id"
              placeholder="e.g. INST-2026-8812"
              required
            />
          </div>
          <div class="form-field-group">
            <label for="profile-rank"
              ><i class="fa-solid fa-award"></i> Academic Rank Level</label
            >
            <select id="profile-rank" required>
              <option value="" disabled selected>Select Academic Rank</option>
              <option value="Instructor 1">Instructor 1</option>
              <option value="Instructor 2">Instructor 2</option>
              <option value="Instructor 3">Instructor 3</option>
              <option value="Assistant Professor">Assistant Professor</option>
              <option value="Associate Professor">Associate Professor</option>
              <option value="Full Professor">Full Professor</option>
            </select>
          </div>
        </div>

        <div class="form-field-group" style="margin-bottom: 25px">
          <label for="profile-college"
            ><i class="fa-solid fa-building-columns"></i> Assigned College
            Department</label
          >
          <select id="profile-college" required>
            <option value="" disabled selected>
              Select Associated Corporate Department Context
            </option>
            <option
              value="College of Computing Studies (Information Technology)"
            >
              College of Computing Studies (Information Technology)
            </option>
            <option value="College of Education">College of Education</option>
            <option value="College of Business Management">
              College of Business Management
            </option>
            <option value="College of Criminal Justice Education (CCJE)">
              College of Criminal Justice Education (CCJE)
            </option>
            <option value="College of Arts and Sciences">
              College of Arts and Sciences
            </option>
          </select>
        </div>

        <div class="profile-action-footer">
          <div class="sync-status-indicator" id="profile-sync-status">
            <i class="fa-solid fa-cloud-check"></i> Profile configuration
            unified locally.
          </div>
          <button
            type="button"
            id="save-profile-btn"
            class="btn-brand btn-brand-primary"
          >
            <i class="fa-solid fa-floppy-disk"></i> Save Profile Details
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
