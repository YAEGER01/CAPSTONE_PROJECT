{% extends 'website/base.html' %}
{% load static %}

{% block title %}CAUFA | Members{% endblock %}

{% block content %}
<section class="section page-hero">
  <div class="section-heading">
    <span class="kicker">Members / Officers</span>
    <h1>CAUFA Officers</h1>
    <p class="lead narrow">Term coverage: {{ term_year }}</p>
  </div>
</section>

<section class="section content-grid officers-grid">
  {% for officer in officers %}
  <article class="member-card">
    <img src="{% static 'img/isu_caufa_official.png' %}" alt="Officer placeholder photo">
    <h2>{{ officer.position }}</h2>
    <p>{{ officer.name }}</p>
  </article>
  {% endfor %}
</section>
{% endblock %}
